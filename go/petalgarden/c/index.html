<!doctype html>
<html lang="en">

    .vs-other { margin: 0 0 4px; opacity: 0.85; }
    .vs-code { margin: 18px 0 0; font-size: 13px; letter-spacing: 0.04em; opacity: 0.8; }
    .vs-num { margin: 2px 0 10px; font-size: 44px; font-weight: 800; letter-spacing: 0.12em; }
    .vs-how { margin: 0 0 16px; font-size: 15px; line-height: 1.5; }
    .vs-open { position: relative; z-index: 4; display: inline-block; margin: 0 0 12px; padding: 11px 22px; border-radius: 999px; font-weight: 800; text-decoration: none; color: #20160a; background: var(--gold); }
    .vs-open[hidden] { display: none; }
  </style>
</head>
<body>
  <main class="go">
    <a class="logo go-logo" href="../../../"><img src="../../../assets/art/logo-white.png" alt="Blucos Studio" width="180" height="30"></a>
    <section class="ghero" style="--c1:#ff8ab8;--c2:#4a2470">
      <img class="gbanner" src="../../../assets/art/banner-petalgarden.webp" alt="" width="640" height="320">
      <div class="ginfo">
        <img class="gicon" src="../../../icons/petalgarden.png" alt="" width="112" height="112">
        <h1 id="head">Petal Garden</h1>
        <p class="tag" id="mode"></p>
        <p class="vs-score" id="score" hidden></p>
        <p class="vs-other" id="other" hidden></p>
        <p class="vs-code" id="codeLabel" hidden></p>
        <p class="vs-num" id="num" hidden></p>
        <p class="vs-how" id="how" hidden></p>
        <div><a class="vs-open" id="open" href="#" hidden></a></div>
        <div class="actions" id="stores"><span class="soon">Coming soon</span></div>
      </div>
    </section>
  </main>
  <script>
    (function () {
      var D = {"kind": "petal", "s": {"en": {"head": "A challenge from {name}", "headAnon": "A challenge from a friend", "headReply": "{name} sent back", "headReplyAnon": "A friend sent back", "beat": "Play the very same board and beat it!", "friend": "A friend", "time": "Two-minute race", "rTime": "{n} petals", "title": "Play together", "join": "Join with a number", "code": "Match number", "reply": "{name}: {score}", "get": "Get the app", "open": "Open in the app", "how": "After installing, open {title} → {join} and enter this number."}, "ko": {"head": "{name}님의 도전", "headAnon": "친구의 도전", "headReply": "{name}님의 답장", "headReplyAnon": "친구의 답장", "beat": "똑같은 판으로 이 기록을 넘어 보세요!", "friend": "친구", "time": "2분 꽃잎 모으기", "rTime": "꽃잎 {n}개", "title": "친구와 겨루기", "join": "번호로 참여하기", "code": "대결 번호", "reply": "{name}: {score}", "get": "앱 받기", "open": "앱으로 열기", "how": "앱을 설치한 뒤 {title} → {join}에서 이 번호를 넣으세요."}, "ja": {"head": "{name}さんからの挑戦", "headAnon": "友だちからの挑戦", "headReply": "{name}さんからの返事", "headReplyAnon": "友だちからの返事", "beat": "同じ盤でこの記録をこえてみましょう!", "friend": "友だち", "time": "2分で花びら集め", "rTime": "花びら {n} 個", "title": "みんなで対戦", "join": "番号で参加する", "code": "対戦番号", "reply": "{name}：{score}", "get": "アプリを入手", "open": "アプリで開く", "how": "インストールしたら「{title}」→「{join}」でこの番号を入れてください。"}, "zh-Hans": {"head": "{name}的挑战", "headAnon": "朋友的挑战", "headReply": "{name}的回复", "headReplyAnon": "朋友的回复", "beat": "用同一个棋盘超过这个成绩吧!", "friend": "朋友", "time": "2分钟收集花瓣", "rTime": "花瓣 {n} 个", "title": "和朋友比赛", "join": "输入号码加入", "code": "比赛号码", "reply": "{name}：{score}", "get": "获取应用", "open": "在应用中打开", "how": "安装后，打开“{title}”→“{join}”，输入这个号码。"}, "zh-Hant": {"head": "{name}的挑戰", "headAnon": "朋友的挑戰", "headReply": "{name}的回覆", "headReplyAnon": "朋友的回覆", "beat": "用同一個棋盤超過這個成績吧!", "friend": "朋友", "time": "2分鐘收集花瓣", "rTime": "花瓣 {n} 個", "title": "和朋友比賽", "join": "輸入號碼加入", "code": "比賽號碼", "reply": "{name}：{score}", "get": "取得應用程式", "open": "在應用程式中開啟", "how": "安裝後，打開「{title}」→「{join}」，輸入這個號碼。"}, "es": {"head": "Un reto de {name}", "headAnon": "Un reto de un amigo", "headReply": "{name} te responde", "headReplyAnon": "Un amigo te responde", "beat": "¡Juega el mismo tablero y supéralo!", "friend": "Un amigo", "time": "Carrera de dos minutos", "rTime": "{n} pétalos", "title": "Jugar juntos", "join": "Unirse con un número", "code": "Número de partida", "reply": "{name}: {score}", "get": "Descargar la app", "open": "Abrir en la app", "how": "Después de instalarla, abre {title} → {join} y escribe este número."}, "pt": {"head": "Um desafio de {name}", "headAnon": "Um desafio de um amigo", "headReply": "{name} respondeu", "headReplyAnon": "Um amigo respondeu", "beat": "Jogue o mesmo tabuleiro e bata este resultado!", "friend": "Um amigo", "time": "Corrida de dois minutos", "rTime": "{n} pétalas", "title": "Jogar juntos", "join": "Entrar com um número", "code": "Número da partida", "reply": "{name}: {score}", "get": "Baixar o app", "open": "Abrir no app", "how": "Depois de instalar, abra {title} → {join} e digite este número."}, "fr": {"head": "Un défi de {name}", "headAnon": "Un défi d'un ami", "headReply": "{name} vous répond", "headReplyAnon": "Un ami vous répond", "beat": "Jouez le même plateau et faites mieux !", "friend": "Un ami", "time": "Course de deux minutes", "rTime": "{n} pétales", "title": "Jouer ensemble", "join": "Rejoindre avec un numéro", "code": "Numéro de partie", "reply": "{name} : {score}", "get": "Obtenir l’app", "open": "Ouvrir dans l’app", "how": "Après l’installation, ouvrez {title} → {join} et saisissez ce numéro."}, "de": {"head": "Herausforderung von {name}", "headAnon": "Eine Herausforderung", "headReply": "Antwort von {name}", "headReplyAnon": "Eine Antwort", "beat": "Spiel dasselbe Feld und schlag das Ergebnis!", "friend": "Jemand", "time": "Zwei-Minuten-Rennen", "rTime": "{n} Blütenblätter", "title": "Gemeinsam spielen", "join": "Mit Nummer beitreten", "code": "Spielnummer", "reply": "{name}: {score}", "get": "App holen", "open": "In der App öffnen", "how": "Nach der Installation {title} → {join} öffnen und diese Nummer eingeben."}, "it": {"head": "Una sfida da {name}", "headAnon": "Una sfida da un amico", "headReply": "{name} ti risponde", "headReplyAnon": "Un amico ti risponde", "beat": "Gioca lo stesso campo e fai meglio!", "friend": "Un amico", "time": "Gara di due minuti", "rTime": "{n} petali", "title": "Gioca insieme", "join": "Entra con un numero", "code": "Numero di partita", "reply": "{name}: {score}", "get": "Scarica l’app", "open": "Apri nell’app", "how": "Dopo l’installazione, apri {title} → {join} e inserisci questo numero."}}, "names": {"en": "Petal Garden", "ko": "꽃잎 정원", "ja": "Petal Garden", "zh-Hans": "Petal Garden", "zh-Hant": "Petal Garden", "es": "Petal Garden", "pt": "Petal Garden", "fr": "Petal Garden", "de": "Petal Garden", "it": "Petal Garden"}, "scheme": "petalgarden://c", "stores": {"en": "<span class=\"soon\">Coming soon<\/span>", "ko": "<span class=\"soon\">곧 출시<\/span>"}, "themes": {}};
      var LANGS = Object.keys(D.s), lang = 'en';
      var tags = navigator.languages || [navigator.language || 'en'];
      for (var i = 0; i < tags.length; i++) {
        var t = String(tags[i] || '').toLowerCase(), base = t.split(/[-_]/)[0], hit = null;
        if (base === 'zh') hit = /hant|-tw|-hk|-mo/.test(t) ? 'zh-Hant' : 'zh-Hans';
        else if (LANGS.indexOf(base) >= 0) hit = base;
        if (hit) { lang = hit; break; }
      }
      var S = D.s[lang];
      var fill = function (str, o) { return str.replace(/\{(\w+)\}/g, function (_, k) { return o[k] != null ? o[k] : ''; }); };
      var set = function (id, text) { var el = document.getElementById(id); el.textContent = text; el.hidden = !text; return el; };
      var clean = function (v) { return Array.from(String(v || '').replace(/[\u0000-\u001f\u007f<>]/g, '').trim()).slice(0, 8).join(''); };
      var okScore = function (v) { return /^\d{1,6}$/.test(v || ''); };
      var num = function (n) { return Number(n).toLocaleString(lang); };
      var score = function (v) { return fill(S.rTime, { n: num(v) }); };
      document.documentElement.lang = lang;
      if (lang === 'ko') document.getElementById('stores').innerHTML = D.stores.ko;
      var gameName = D.names[lang] || D.names.en;
      document.title = gameName + ' · Blucos Studio';
      var q = new URLSearchParams((location.hash || '').replace(/^#/, '') || location.search.replace(/^\?/, ''));
      var m = q.get('m'), s = q.get('s'), s2 = q.get('s2'), n = clean(q.get('n')), n2 = clean(q.get('n2'));
      var shown = false;
      if (D.kind === 'petal' && /^\d{4}$/.test(m || '') && okScore(s)) {
        // Petal Garden: one mode, the two-minute race; s = petals. A reply (s2) is "<n> sent back".
        var rep = okScore(s2);
        set('head', n ? fill(rep ? S.headReply : S.head, { name: n }) : (rep ? S.headReplyAnon : S.headAnon));
        set('mode', gameName + ' · ' + S.time);
        set('score', score(s));
        if (okScore(s2)) set('other', fill(S.reply, { name: n2 || S.friend, score: score(s2) }));
        set('how', S.beat + ' ' + fill(S.how, { title: S.title, join: S.join }));
        shown = true;
      }
      if (D.kind === 'evo' && /^\d{4}$/.test(m || '') && /^\d{1,7}$/.test(s || '')) {
        // Evolution 2048: s score, g top stage 1-14, t theme id (Evolution when left out or unknown)
        var th = D.themes[lang][D.themes[lang][q.get('t')] ? q.get('t') : 'evolution'];
        var stage = function (g) { g = Math.min(14, Math.max(1, parseInt(g, 10) || 0)); return th.stages[g - 1] || ''; };
        var pts = function (v) { return fill(S.points, { score: num(v) }); };
        set('head', n ? fill(S.head, { name: n }) : S.headAnon);
        set('mode', gameName + ' · ' + th.name);
        set('score', pts(s));
        set('other', [q.get('g') ? fill(S.reached, { stage: stage(q.get('g')) }) : '',
          /^\d{1,7}$/.test(s2 || '') ? fill(S.reply, { name: n2 || S.friend, score: pts(s2) }) : ''].filter(Boolean).join(' · '));
        set('how', S.beat + ' ' + fill(S.how, { title: S.title }) + ' ' + S.rules);
        shown = true;
      }
      if (D.kind === 'score' && /^\d{4}$/.test(m || '') && /^\d{1,8}$/.test(s || '')) {
        // Starfall: m odd = two-minute race, m even = endless match; s is the score in both
        var pts = function (v) { return fill(S.points, { score: num(v) }); };
        set('head', n ? fill(S.head, { name: n }) : S.headAnon);
        set('mode', gameName + ' · ' + (Number(m) % 2 ? S.race : S.endless));
        set('score', pts(s));
        if (/^\d{1,8}$/.test(s2 || '')) set('other', fill(S.reply, { name: n2 || S.friend, score: pts(s2) }));
        set('how', S.beat + ' ' + fill(S.how, { join: S.join }));
        shown = true;
      }
      if (D.kind === 'fossil' && /^\d{4}$/.test(m || '') && /^\d{1,4}$/.test(s || '')) {
        // Fossil Dig: three digs in a row. s = 1000 + (3999 - seconds) when all three were dug,
        // 100 + bones when the pickaxe broke, else bones found
        var dig = function (v) {
          v = Number(v);
          if (v >= 1000) { var sec = Math.max(0, 3999 - (v - 1000)); return fill(S.rDone, { time: Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0') }); }
          if (v >= 100) return fill(S.rBroke, { n: num(v - 100) });
          return fill(S.rBones, { n: num(v) });
        };
        var rep = /^\d{1,4}$/.test(s2 || '');
        set('head', n ? fill(rep ? S.headReply : S.head, { name: n }) : (rep ? S.headReplyAnon : S.headAnon));
        set('mode', gameName + ' · ' + S.mode);
        set('score', dig(s));
        if (rep) set('other', fill(S.reply, { name: n2 || S.friend, score: dig(s2) }));
        set('how', S.beat + ' ' + fill(S.how, { title: S.title, join: S.join }));
        shown = true;
      }
      if (shown) {
        set('codeLabel', S.code);
        set('num', m);
        if (D.scheme) set('open', S.open).href = D.scheme + location.hash.replace(/[^\w#&=%.~-]/g, '');
      } else {
        set('head', gameName);
        set('mode', S.title);
      }
    })();
  </script>
</body>
</html>
